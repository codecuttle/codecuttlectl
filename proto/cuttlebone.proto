syntax = "proto3";

package cuttlebone.v1;

option go_package = "github.com/codecuttle/codecuttlectl/internal/cuttlebone/v1;cuttlebonev1";

// ToolPlugin is the core RPC service that every Cuttlebone plugin must implement.
// This is the interface between the codecuttlectl orchestrator (host) and each
// tool plugin (subprocess). Communication occurs over gRPC via HashiCorp go-plugin.
service ToolPlugin {
  // Describe returns the tool's metadata, JSON schema, and LLM context hints.
  // Called once during plugin discovery/initialization.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Execute runs the tool with the given input parameters.
  // Called each time the LLM invokes this tool.
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);

  // ExecuteStream runs the tool and streams output incrementally.
  // Plugins that support streaming declare supports_streaming=true in capabilities.
  // The orchestrator falls back to Execute() for non-streaming plugins.
  rpc ExecuteStream(ExecuteRequest) returns (stream ExecuteStreamEvent);
}

// DescribeRequest is sent by the orchestrator to discover tool capabilities.
message DescribeRequest {}

// DescribeResponse provides the tool's full metadata to the orchestrator.
message DescribeResponse {
  // name is the tool's unique identifier used in LLM tool_use blocks.
  string name = 1;

  // description is a human/LLM-readable explanation of what the tool does.
  string description = 2;

  // input_schema is the JSON Schema (as a JSON string) describing the tool's
  // expected input parameters. This is passed directly to the LLM's tool config.
  string input_schema = 3;

  // llm_context_hint provides additional instructions for the LLM about how
  // and when to use this tool. This is injected into the system prompt alongside
  // the tool definitions to resolve the "missing context problem" described in
  // the architecture docs. Unlike comments in .proto files, this field survives
  // serialization and is available at runtime.
  string llm_context_hint = 4;

  // version is the semantic version of this tool plugin.
  string version = 5;

  // capabilities declares optional features this plugin supports.
  ToolCapabilities capabilities = 6;

  // skills contains versioned knowledge, workflows, and behavioral guidance
  // that the plugin embeds. These are conditionally injected into the system
  // prompt based on trigger expressions evaluated against session state.
  // Companion plugins may ship only skills (no tool) for pure knowledge injection.
  repeated Skill skills = 7;

  // command_patterns are shell command patterns that this tool claims ownership of.
  // These are passed to other plugins (e.g., bash_exec) via ExecuteRequest.available_tools
  // to enable dynamic tool discipline enforcement. See ToolInfo.command_patterns for syntax.
  // An empty list means this tool does not claim any shell command patterns.
  repeated string command_patterns = 8;
}

// Skill represents a unit of knowledge, workflow, or behavioral guidance
// that a plugin ships alongside its tool. Skills are conditionally injected
// into the LLM's context window based on trigger expressions.
message Skill {
  // name is a unique identifier for this skill within the plugin.
  string name = 1;

  // trigger is an expression that determines when this skill is injected.
  // Syntax supports OR-combined conditions separated by '|':
  //   "always"                 - inject on every Converse call (subject to budget)
  //   "on_request"             - only when agent explicitly asks via get_skill
  //   "on_error:compile"       - when Inkwell detects a compile error
  //   "on_error:syntax"        - when Inkwell detects a syntax error
  //   "on_error:*"             - on any error
  //   "on_tool:bash_exec"      - when a specific tool was used recently
  //   "on_file:*.go"           - when a matching file was referenced
  //   "on_file:Dockerfile"     - when a specific file was referenced
  //   "on_language:python"     - when a language was detected in recent output
  //   "on_turn:first"          - first turn of the session only
  //   "on_loop"                - when the reconciler detects a looping failure
  // Example: "on_error:compile|on_language:go"
  string trigger = 2;

  // content_type classifies the skill content:
  //   "markdown"   - general documentation/guidance
  //   "workflow"   - step-by-step procedure
  //   "knowledge"  - domain-specific reference material
  string content_type = 3;

  // content is the actual embedded text (typically Markdown).
  string content = 4;

  // priority determines injection order when multiple skills fire.
  // Higher values = more important. Range: 0-100.
  // Used as tiebreaker after relevance/recency scoring.
  int32 priority = 5;

  // estimated_tokens is the author's estimate of how many tokens this
  // content will consume in the context window. Used for budget management.
  // If 0, the orchestrator estimates as len(content)/4.
  int32 estimated_tokens = 6;
}

// ToolCapabilities declares optional features a plugin supports.
message ToolCapabilities {
  // supports_streaming indicates the plugin can stream partial results.
  bool supports_streaming = 1;

  // supports_cancellation indicates the plugin respects context cancellation.
  bool supports_cancellation = 2;

  // requires_confirmation indicates the tool performs destructive operations
  // and the orchestrator should confirm with the user before executing.
  bool requires_confirmation = 3;

  // max_timeout_seconds is the maximum time this tool should be allowed to run.
  // 0 means use the orchestrator's default timeout.
  int32 max_timeout_seconds = 4;
}

// ExecuteRequest contains the input for a tool invocation.
message ExecuteRequest {
  // input is the JSON-encoded parameters matching the tool's input_schema.
  // The orchestrator deserializes the LLM's tool_use input and passes it here.
  string input = 1;

  // working_directory is the current working directory context from the session.
  string working_directory = 2;

  // request_id is a unique identifier for this invocation (for tracing/telemetry).
  string request_id = 3;

  // available_tools provides the full tool registry to the executing plugin.
  // This enables plugins (especially bash_exec) to dynamically enforce tool
  // discipline by knowing what other tools are loaded and what they handle.
  repeated ToolInfo available_tools = 4;
}

// ToolInfo provides minimal metadata about a loaded tool, passed to plugins
// via ExecuteRequest so they can make context-aware decisions (e.g., bash_exec
// can dynamically detect when the agent should be using a dedicated tool).
message ToolInfo {
  // name is the tool's unique identifier (e.g., "git", "github", "webfetch").
  string name = 1;

  // description is the tool's purpose summary.
  string description = 2;

  // command_patterns are shell command patterns that this tool claims ownership of.
  // bash_exec uses these to detect when a command should be routed to this tool.
  // Patterns support simple glob-style matching:
  //   "git *"              - any command starting with "git "
  //   "*api.github.com*"   - any command containing "api.github.com"
  //   "curl *"             - any command starting with "curl "
  // An empty list means this tool does not claim any shell command patterns.
  repeated string command_patterns = 3;
}

// ExecuteResponse contains the result of a tool invocation.
message ExecuteResponse {
  // output is the text content returned to the LLM as the tool result.
  string output = 1;

  // error_message is set when the tool execution fails. If non-empty, the
  // orchestrator will report this as a tool error to the LLM.
  string error_message = 2;

  // is_error indicates whether this response represents a failure.
  bool is_error = 3;

  // metadata contains optional structured data about the execution
  // (e.g., bytes written, exit code, timing information).
  map<string, string> metadata = 4;
}

// ExecuteStreamEvent is a single event emitted during streaming tool execution.
message ExecuteStreamEvent {
  oneof event {
    // output_delta contains incremental output text (stdout).
    OutputDelta output_delta = 1;

    // error_delta contains incremental error text (stderr).
    OutputDelta error_delta = 2;

    // progress contains a structured progress update.
    ProgressUpdate progress = 3;

    // final contains the completed result (same as ExecuteResponse).
    // This is always the last event in the stream.
    ExecuteResponse final = 4;
  }
}

// OutputDelta represents an incremental chunk of tool output.
message OutputDelta {
  // text is the incremental output content.
  string text = 1;
}

// ProgressUpdate provides structured progress information during execution.
message ProgressUpdate {
  // message is a human-readable progress description (e.g., "Building plugin 3/12...").
  string message = 1;

  // percent is the completion percentage (0.0-1.0). Use -1 if unknown.
  float percent = 2;

  // metadata contains optional structured progress data.
  map<string, string> metadata = 3;
}
